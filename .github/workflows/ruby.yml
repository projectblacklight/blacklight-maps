name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (ruby ${{ matrix.ruby }} / rails ${{ matrix.rails_version }} / blacklight ${{ matrix.blacklight_version }} / ${{ matrix.additional_name }})
    strategy:
      matrix:
        ruby: ["3.3", "3.4"]
        rails_version: ["~> 8.0.0", "~> 8.1.0"]
        blacklight_version: ["~> 8.0"]
        additional_name: ["importmaps", "esbuild"]
        include:
          - additional_name: "importmaps"
            additional_engine_cart_rails_options: "-a propshaft --css=bootstrap --javascript=importmap"
          - additional_name: "esbuild"
            additional_engine_cart_rails_options: "-a propshaft --css=bootstrap --javascript=esbuild"
    env:
      RAILS_VERSION: ${{ matrix.rails_version }}
      BLACKLIGHT_VERSION: ${{ matrix.blacklight_version }}
      ENGINE_CART_RAILS_OPTIONS: "--skip-git --skip-action-cable --skip-docker --skip-brakeman --skip-kamal --skip-solid ${{ matrix.additional_engine_cart_rails_options }}"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake ci
