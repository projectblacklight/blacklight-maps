services:
  solr:
    environment:
      - SOLR_PORT # Set via environment variable or use default defined in .env file
      - SOLR_VERSION # Set via environment variable or use default defined in .env file
      - SOLR_MODULES # Set via environment variable or use default defined in .env file
    image: "solr:${SOLR_VERSION}"
    volumes:
      - $PWD/.internal_test_app/solr/conf:/opt/solr/conf
    ports:
      - "${SOLR_PORT}:8983"
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - blacklight-core
      - /opt/solr/conf
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/blacklight-core/admin/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s